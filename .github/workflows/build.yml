name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runner 已预装 Android SDK（含 platform 34 / build-tools）
      # 不再用 android-actions/setup-android@v3 —— 2026-11 实测它这一步会直接失败
      - name: 确认 Android SDK 环境
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          # 面板凭据：在仓库 Settings → Secrets 里配 PANEL_USER / PANEL_PASS
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: taskpanel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 发布到 Release：APK 变成公开可下载链接，方便直接取用/发到手机
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TaskNotes ${{ github.run_number }}
          body: |
            自动构建 · commit ${{ github.sha }}
            面板地址：https://blog.jermainli.world/panel/
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
